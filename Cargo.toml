[package]
name = "leekscript-lsp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "leekscript-lsp"
path = "src/main.rs"

[dependencies]
leekscript-rs = { path = "../leekscript-rs", features = ["utf16"] }
sipha = { path = "../sipha/sipha", features = ["utf16"] }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
